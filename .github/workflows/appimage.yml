name: Build AppImage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config \
            rustc cargo \
            libgl1-mesa-dev \
            qt6-base-dev libqt6svg6-dev libqt6websockets6-dev \
            qt6-multimedia-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools libxkbcommon-dev \
            libzip-dev zipcmp zipmerge ziptool \
            libmicrohttpd-dev libsodium-dev libsystemd-dev \
            libwebp-dev libzstd-dev \
            libavcodec-dev libavfilter-dev libavformat-dev \
            libavutil-dev libswscale-dev

      - name: Add Qt 6 tools to PATH
        run: |
          test -x /usr/lib/qt6/bin/lconvert
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"

      - name: Deploy linuxdeploy
        run: |
          mkdir -p "$HOME/.local/bin"

          wget -O "$HOME/.local/bin/linuxdeploy-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

          wget -O "$HOME/.local/bin/linuxdeploy-plugin-qt-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage

          chmod +x "$HOME/.local/bin/linuxdeploy-x86_64.AppImage" \
            "$HOME/.local/bin/linuxdeploy-plugin-qt-x86_64.AppImage"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake --preset linux-release-qt6-all-make \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DINITSYS=systemd \
            -DBUILD_PACKAGE_SUFFIX=x86_64 \
            -DAPPIMAGE=ON \
            -DENABLE_ARCH_NATIVE=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Install in AppDir
        run: |
          mkdir -p AppDir
          DESTDIR="$GITHUB_WORKSPACE/AppDir" \
            cmake --install build --config Release
          # The cmake --install step triggers linuxdeploy via a custom target
          # and creates Drawpile-x86_64.AppImage in the workspace root.
          # Rename it to the expected artifact name.
          mv Drawpile-x86_64.AppImage DrawpileITI-x86_64.AppImage

      - name: Post artifact
        uses: actions/upload-artifact@v7
        with:
          name: DrawpileITI-AppImage-x86_64
          path: "*.AppImage"

      - name: Publish in Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: DrawpileITI-x86_64.AppImage
          generate_release_notes: true
